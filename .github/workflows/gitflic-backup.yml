# Manual-only. Does not trigger on push, pull request or a schedule.
name: UNO GitFlic backup (manual only)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Verify, or back up refs under GitFlic github/*"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - backup
      confirmation:
        description: "For backup, type BACKUP_UNO"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: uno-gitflic-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate explicit backup approval
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == backup && "$CONFIRMATION" != BACKUP_UNO ]]; then
            echo "To back up, confirm BACKUP_UNO" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify/backup GitHub refs without altering GitFlic main
        env:
          OPERATION: ${{ inputs.operation }}
          UNO_GITFLIC_TOKEN: ${{ secrets.UNO_GITFLIC_TOKEN }}
        run: bash tools/backup_gitflic.sh "$OPERATION"
