# Owner approval 2026-11-08: necessary GitHub Actions for this feature-branch Android SDK build.
# One path-filtered push is used because workflow_dispatch is not exposed by this chat connector.
# Never publishes releases, writes to main, uploads personal data or accesses repository secrets.
name: UNO feature Android SDK verification (private debug)

on:
  push:
    branches:
      - feat/uno-foundation-hardening-20261107
    paths:
      - .github/workflows/uno-feature-android-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uno-feature-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout feature branch exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7 (repository has no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install compileSdk and build-tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check offline manifest and SQLite host schema
        run: |
          set -euo pipefail
          python3 scripts/static_contract_check.py
          python3 scripts/test_sqlite_outcome_schema.py
          python3 scripts/test_lab_tools.py
      - name: Run all existing Kotlin host checks if standalone compiler is present
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          if command -v kotlinc >/dev/null 2>&1; then
            bash scripts/run_all_preflight.sh | tee ci-evidence/HOST_PREFLIGHT.txt
          else
            printf '%s\n' 'SKIPPED_STANDALONE_KOTLINC: core Gradle host tests still run in next step.' | tee ci-evidence/HOST_PREFLIGHT.txt
          fi
      - name: Run complete Gradle core JVM suite
        run: gradle --no-daemon --stacktrace :core:unoHostTests
      - name: Compile current Android app with SDK 35
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Android lint current APK sources
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - name: Validate debug APK and record source SHA
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ci-evidence
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee ci-evidence/APK_SHA256SUMS.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > ci-evidence/APK_BADGING.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > ci-evidence/APK_PERMISSIONS.txt
          grep -E '^package:|^sdkVersion:|^targetSdkVersion:' ci-evidence/APK_BADGING.txt
          grep -q "org.unovyra.uno.scaffold" ci-evidence/APK_BADGING.txt
          if grep -E 'android.permission.(INTERNET|RECORD_AUDIO|CAMERA)' ci-evidence/APK_PERMISSIONS.txt; then
            echo "FAIL: forbidden capability found in diagnostic APK" >&2
            exit 1
          fi
          printf 'SHA=%s\nREF=%s\n' "${GITHUB_SHA}" "${GITHUB_REF_NAME}" > ci-evidence/BUILD_PROVENANCE.txt
      - name: Private debug artifact for owner (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uno-feature-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/ci-evidence/*.txt
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 3
