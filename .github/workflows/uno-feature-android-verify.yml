# Owner approval 2026-11-08: necessary GitHub Actions for this feature-branch Android SDK build.
# 2026-11-10: compile repair after CI failure #42725562176 (keep Kotlin trailing clock lambda last).
# 2026-11-10: exact vault first-open genesis regression (single necessary build).
# 2026-11-10 consent + immutable provenance corrective audit, one necessary APK check.
# Original WP-05 single writer and on-device foundation event integration.
# Original WP-05 exact memory: encrypted snapshot, consent/boot scope and fault tests.
# Original roadmap WP-06-T01 core reference test; not the experimental GGUF picker.
# WP-06 storage-safe model picker verification: native direct SAF FD path, no implicit copy.
# WP-05 text-cycle + AES-GCM/STOP verification:
# Scoped second foundation pass, no new Android permissions.
# WP-04/WP-05 integrated text-cycle verification:
# Runs full host suite and Android build; keeps fail-closed Android effect boundary.
# WP-04 verification: allow exactly one additional non-exported chat Activity; no new capabilities.
# Path-filtered push is permitted for necessary builds; keep previous app/data intact.
# The CI-only app label and the in-app package ID must distinguish it from all prior UNO builds.
# UI gate also verifies that Android credential outcomes appear locally below the owner controls.
# This run also verifies the bounded app-private marker and separate descriptor readback.
# Final current-SHA build additionally includes a distinct read-only reopen button for post-restart checks.
# Never publishes releases, writes to main, uploads personal data or accesses repository secrets.
name: UNO feature Android SDK verification (private debug)

on:
  push:
    branches:
      - feat/uno-foundation-hardening-20261107
    paths:
      - .github/workflows/uno-feature-android-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uno-feature-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout feature branch exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7 (repository has no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install compileSdk and build-tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Check offline manifest and SQLite host schema
        run: |
          set -euo pipefail
          python3 scripts/static_contract_check.py
          # Includes negative UI fixture regressions for SQLite/owner/copy controls.
          python3 scripts/test_static_contract_check.py
          python3 scripts/test_sqlite_outcome_schema.py
          python3 scripts/test_lab_tools.py
      - name: Run all existing Kotlin host checks if standalone compiler is present
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          if command -v kotlinc >/dev/null 2>&1; then
            bash scripts/run_all_preflight.sh | tee ci-evidence/HOST_PREFLIGHT.txt
          else
            printf '%s\n' 'SKIPPED_STANDALONE_KOTLINC: core Gradle host tests still run in next step.' | tee ci-evidence/HOST_PREFLIGHT.txt
          fi
      - name: Run complete Gradle core JVM suite
        run: gradle --no-daemon --stacktrace :core:unoHostTests
      - name: Compile isolated side-by-side Android debug app with SDK 35
        run: gradle --no-daemon --stacktrace -PunoIsolatedDebugSuffix=ci${GITHUB_RUN_ID} :app:assembleDebug
      - name: Android lint current APK sources
        run: gradle --no-daemon --stacktrace -PunoIsolatedDebugSuffix=ci${GITHUB_RUN_ID} :app:lintDebug
      - name: Validate debug APK and record source SHA
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'lib/arm64-v8a/libuno_llama.so'
          mkdir -p ci-evidence
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee ci-evidence/APK_SHA256SUMS.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > ci-evidence/APK_BADGING.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > ci-evidence/APK_PERMISSIONS.txt
          grep -E '^package:|^sdkVersion:|^targetSdkVersion:' ci-evidence/APK_BADGING.txt
          grep -Fq "package: name='org.unovyra.uno.scaffold.ci${GITHUB_RUN_ID}'" ci-evidence/APK_BADGING.txt
          ! grep -Fq "package: name='org.unovyra.uno.scaffold'" ci-evidence/APK_BADGING.txt
          # Labels must be resource-backed: inline manifest labels are omitted by aapt badging.
          grep -E '^application(-label)?:' ci-evidence/APK_BADGING.txt
          grep -Fq "application-label:'UNO TEST · ci${GITHUB_RUN_ID}'" ci-evidence/APK_BADGING.txt
          if grep -E 'android.permission.(INTERNET|RECORD_AUDIO|CAMERA)' ci-evidence/APK_PERMISSIONS.txt; then
            echo "FAIL: forbidden capability found in diagnostic APK" >&2
            exit 1
          fi
          printf 'SHA=%s\nREF=%s\nRUN_ID=%s\nPACKAGE=%s\nINSTALL_MODE=SIDE_BY_SIDE_NO_UNINSTALL\n' "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${GITHUB_RUN_ID}" "org.unovyra.uno.scaffold.ci${GITHUB_RUN_ID}" > ci-evidence/BUILD_PROVENANCE.txt
      - name: Private debug artifact for owner (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uno-side-by-side-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/ci-evidence/*.txt
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 3
